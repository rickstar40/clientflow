<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClientFlow | Client Management</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f4f6fa;

  color: #202a3b;

}

header {

  background: #17243a;

  color: white;

  padding: 24px;

}

header h1 {

  margin: 0;

  font-size: 26px;

}

header p {

  margin: 7px 0 0;

  color: #bdc9dc;

}

.container {

  max-width: 1100px;

  margin: auto;

  padding: 22px;

}

.stats {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 14px;

}

.card {

  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow: 0 2px 12px #17243a0c;

  margin-bottom: 16px;

  min-width: 0;

}

.stat {

  font-size: 28px;

  font-weight: bold;

  margin-top: 10px;

}

h2 {

  font-size: 19px;

}

input, button, select {

  padding: 12px;

  border-radius: 7px;

  border: 1px solid #d9deea;

  font-size: 14px;

}

input {

  width: 100%;

  margin: 6px 0 12px;

}

button {

  background: #315ee8;

  color: white;

  border: 0;

  cursor: pointer;

}

button:hover {

  background: #244bc5;

}

form {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px;

}

form button {

  align-self: end;

  margin-bottom: 12px;

}

.table-wrap {

  width: 100%;

  overflow-x: auto;

}

table {

  width: 100%;

  border-collapse: collapse;

}

th, td {

  text-align: left;

  padding: 12px;

  border-bottom: 1px solid #edf0f5;

  overflow-wrap: anywhere;

}

th {

  color: #68758a;

  font-size: 13px;

}

.delete {

  background: #e34b4b;

  padding: 8px 12px;

}

.empty {

  text-align: center;

  color: #8993a5;

  padding: 25px;

}

footer {

  text-align: center;

  color: #8993a5;

  font-size: 12px;

  padding: 15px;

}

@media (max-width: 600px) {

  .container {

    padding: 12px;

  }

  header {

    padding: 20px 16px;

  }

  .stats {

    grid-template-columns: 1fr;

    gap: 8px;

  }

  .card {

    padding: 15px;

  }

  form {

    grid-template-columns: 1fr;

  }

  form button {

    width: 100%;

  }

  .table-wrap {

    overflow: visible;

  }

  table, tbody {

    display: block;

    width: 100%;

  }

  thead {

    display: none;

  }

  tbody tr {

    display: block;

    background: #f8f9fc;

    border: 1px solid #e5e9f1;

    border-radius: 10px;

    padding: 10px;

    margin-bottom: 12px;

  }

  tbody td {

    display: flex;

    justify-content: space-between;

    gap: 12px;

    padding: 9px 4px;

    border-bottom: 1px solid #e5e9f1;

    font-size: 13px;

    text-align: right;

    overflow-wrap: anywhere;

  }

  tbody td::before {

    content: attr(data-label);

    font-weight: bold;

    color: #68758a;

    text-align: left;

    flex-shrink: 0;

  }

  tbody td:last-child {

    border-bottom: 0;

  }

  tbody td.empty {

    display: block;

    text-align: center;

  }

}

</style>

</head>

<body>

<header>

  <h1>ClientFlow</h1>

  <p>Your business. Your clients. All in one place.</p>

</header>

<main class="container">

  <div class="stats">

    <div class="card">

      Clients

      <div class="stat" id="total">0</div>

    </div>

    <div class="card">

      Active clients

      <div class="stat" id="active">0</div>

    </div>

    <div class="card">

      Total enquiries

      <div class="stat" id="enquiries">0</div>

    </div>

  </div>

  <section class="card">

    <h2>Add a new client</h2>

    <form id="clientForm">

      <div>

        <label for="name">Client name</label>

        <input id="name" placeholder="Full name" required>

      </div>

      <div>

        <label for="email">Email address</label>

        <input id="email" type="email" placeholder="Email">

      </div>

      <div>

        <label for="phone">Phone number</label>

        <input id="phone" type="tel" placeholder="Phone number">

      </div>

      <div>

        <label for="status">Client status</label>

        <select id="status" style="width:100%">

          <option>Active</option>

          <option>Enquiry</option>

          <option>Completed</option>

        </select>

      </div>

      <button type="submit">+ Add client</button>

    </form>

  </section>

  <section class="card">

    <h2>Client directory</h2>

    <input

      id="search"

      placeholder="Search clients..."

      oninput="render()"

    >

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Name</th>

            <th>Email</th>

            <th>Phone</th>

            <th>Status</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody id="clients"></tbody>

      </table>

    </div>

  </section>

  <footer>ClientFlow © 2026</footer>

</main>

<script>

let data = [];

try {

  data = JSON.parse(

    localStorage.getItem("clientflow_clients") || "[]"

  );

  if (!Array.isArray(data)) data = [];

} catch (e) {

  data = [];

}

function save() {

  localStorage.setItem(

    "clientflow_clients",

    JSON.stringify(data)

  );

  render();

}

function render() {

  const query = document

    .getElementById("search")

    .value.toLowerCase();

  const filtered = data.filter(c =>

    [c.name, c.email, c.phone, c.status]

      .some(value =>

        String(value || "").toLowerCase().includes(query)

      )

  );

  document.getElementById("total").textContent = data.length;

  document.getElementById("active").textContent =

    data.filter(c => c.status === "Active").length;

  document.getElementById("enquiries").textContent =

    data.filter(c => c.status === "Enquiry").length;

  const tbody = document.getElementById("clients");

  tbody.innerHTML = "";

  if (!filtered.length) {

    const tr = document.createElement("tr");

    const td = document.createElement("td");

    td.colSpan = 5;

    td.className = "empty";

    td.textContent = "No clients found. Add your first client above.";

    tr.appendChild(td);

    tbody.appendChild(tr);

    return;

  }

  filtered.forEach(c => {

    const tr = document.createElement("tr");

    const fields = [

      ["Name", c.name],

      ["Email", c.email],

      ["Phone", c.phone],

      ["Status", c.status]

    ];

    fields.forEach(([label, value]) => {

      const td = document.createElement("td");

      td.dataset.label = label;

      td.textContent = value || "—";

      tr.appendChild(td);

    });

    const td = document.createElement("td");

    td.dataset.label = "Action";

    const btn = document.createElement("button");

    btn.textContent = "Delete";

    btn.className = "delete";

    btn.onclick = () => {

      if (confirm("Delete this client?")) {

        data = data.filter(x => x.id !== c.id);

        save();

      }

    };

    td.appendChild(btn);

    tr.appendChild(td);

    tbody.appendChild(tr);

  });

}

document.getElementById("clientForm")

  .addEventListener("submit", function(e) {

    e.preventDefault();

    data.push({

      id: Date.now(),

      name: document.getElementById("name").value.trim(),

      email: document.getElementById("email").value.trim(),

      phone: document.getElementById("phone").value.trim(),

      status: document.getElementById("status").value

    });

    save();

    this.reset();

  });

render();

</script>
<div style="margin:20px 0;">

  <input

    type="search"

    id="clientSearch"

    placeholder="Search clients..."

    oninput="searchClients()"

    style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;"

  >

</div>

<script>

function searchClients() {

  const search = document.getElementById("clientSearch").value.toLowerCase();

  const rows = document.querySelectorAll("#clientTable tbody tr");

  rows.forEach(row => {

    row.style.display = row.innerText.toLowerCase().includes(search) ? "" : "none";

  });

}

</script>
</body>

</html>
