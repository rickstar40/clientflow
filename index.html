

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ClientFlow | Client Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#202a3b}

header{background:#17243a;color:white;padding:24px}

header h1{margin:0;font-size:27px}

header p{color:#bdc9dc;margin:7px 0 0}

.container{max-width:1100px;margin:auto;padding:20px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.card{background:white;padding:20px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 12px #17243a0c}

.stat{font-size:30px;font-weight:bold;margin-top:10px}

h2{font-size:19px}

input,select,button{padding:13px;border-radius:7px;border:1px solid #d9deea;font-size:15px}

input,select{width:100%;margin:6px 0 12px}

form{display:grid;grid-template-columns:1fr 1fr;gap:12px}

button{background:#315ee8;color:white;border:0;cursor:pointer}

button:disabled{opacity:.5}

.delete{background:#df4848;padding:9px 12px}

.table-wrap{overflow-x:auto}

table{width:100%;border-collapse:collapse}

th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5}

th{color:#68758a;font-size:13px}

#message{padding:12px;border-radius:8px;margin-bottom:15px;display:none}

footer{text-align:center;color:#8993a5;padding:20px;font-size:12px}

@media(max-width:600px){

.container{padding:12px}

header{padding:20px 16px}

.grid{grid-template-columns:1fr}

.card{padding:15px}

form{grid-template-columns:1fr}

table,tbody,tr,td{display:block;width:100%}

thead{display:none}

tbody tr{background:#f8f9fc;padding:10px;margin-bottom:12px;border-radius:9px}

tbody td{display:flex;justify-content:space-between;gap:10px;font-size:13px}

tbody td:before{content:attr(data-label);font-weight:bold}

}

</style>

</head>

<body>

<header>

<h1>ClientFlow</h1>

<p>Your business. Your clients. All in one place.</p>

</header>

<main class="container">

<div id="message"></div>

<div class="grid">

<div class="card">Total clients<div class="stat" id="total">0</div></div>

<div class="card">Active clients<div class="stat" id="active">0</div></div>

<div class="card">Total enquiries<div class="stat" id="enquiries">0</div></div>

</div>

<section class="card">

<h2>Add a new client</h2>

<form id="clientForm">

<div>

<label for="name">Client name</label>

<input id="name" placeholder="Full name" required>

</div>

<div>

<label for="email">Email address</label>

<input id="email" type="email" placeholder="Email">

</div>

<div>

<label for="phone">Phone number</label>

<input id="phone" type="tel" placeholder="Phone number">

</div>

<div>

<label for="status">Client status</label>

<select id="status">

<option>Active</option>

<option>Enquiry</option>

<option>Completed</option>

</select>

</div>

<button type="submit" id="addButton">+ Add client</button>

</form>

</section>

<section class="card">

<h2>Client directory</h2>

<input id="search" type="search" placeholder="Search clients...">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Name</th><th>Email</th><th>Phone</th>

<th>Status</th><th>Action</th>

</tr>

</thead>

<tbody id="clients"></tbody>

</table>

</div>

</section>

<footer>ClientFlow © 2026</footer>

</main>

<script>

const SUPABASE_URL = "https://lsfglmqxxrvtmtgvwzah.supabase.co";

const SUPABASE_KEY = "sb_publishable_bgZGWSwfSUVe358EozRomw_CcINZ0Yh";

const db = window.supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY

);

let clients = [];

function message(text, error = false) {

  const box = document.getElementById("message");

  box.textContent = text;

  box.style.display = "block";

  box.style.background = error ? "#ffe8e8" : "#e6f6eb";

  box.style.color = error ? "#a32222" : "#176b36";

}

function updateStats() {

  document.getElementById("total").textContent = clients.length;

  document.getElementById("active").textContent =

    clients.filter(c => c.status === "Active").length;

  document.getElementById("enquiries").textContent =

    clients.filter(c => c.status === "Enquiry").length;

}

function render() {

  const query = document.getElementById("search").value.toLowerCase();

  const tbody = document.getElementById("clients");

  tbody.replaceChildren();

  const filtered = clients.filter(c =>

    [c.name, c.email, c.phone, c.status]

      .some(v => String(v || "").toLowerCase().includes(query))

  );

  if (!filtered.length) {

    const tr = document.createElement("tr");

    const td = document.createElement("td");

    td.colSpan = 5;

    td.textContent = "No clients found.";

    tr.appendChild(td);

    tbody.appendChild(tr);

  }

  filtered.forEach(c => {

    const tr = document.createElement("tr");

    [["Name",c.name],["Email",c.email],

     ["Phone",c.phone],["Status",c.status]]

      .forEach(([label,value]) => {

        const td = document.createElement("td");

        td.dataset.label = label;

        td.textContent = value || "—";

        tr.appendChild(td);

      });

    const td = document.createElement("td");

    td.dataset.label = "Action";

    const button = document.createElement("button");

    button.textContent = "Delete";

    button.className = "delete";

    button.onclick = () => deleteClient(c.id);

    td.appendChild(button);

    tr.appendChild(td);

    tbody.appendChild(tr);

  });

  updateStats();

}

async function loadClients() {

  message("Connecting to your database...");

  const { data, error } = await db

    .from("clients")

    .select("*")

    .order("created_at", { ascending: false });

  if (error) {

    message("Database error: " + error.message, true);

    return;

  }

  clients = data || [];

  render();

  message("Connected successfully. Your clients are loaded.");

}

document.getElementById("clientForm").addEventListener("submit", async e => {

  e.preventDefault();

  const button = document.getElementById("addButton");

  button.disabled = true;

  button.textContent = "Saving...";

  const client = {

    name: document.getElementById("name").value.trim(),

    email: document.getElementById("email").value.trim(),

    phone: document.getElementById("phone").value.trim(),

    status: document.getElementById("status").value

  };

  const { error } = await db.from("clients").insert([client]);

  button.disabled = false;

  button.textContent = "+ Add client";

  if (error) {

    message("Could not save client: " + error.message, true);

    return;

  }

  e.target.reset();

  await loadClients();

});

async function deleteClient(id) {

  if (!confirm("Are you sure you want to delete this client?")) return;

  const { error } = await db

    .from("clients")

    .delete()

    .eq("id", id);

  if (error) {

    message("Could not delete client: " + error.message, true);

    return;

  }

  await loadClients();

}

document.getElementById("search").addEventListener("input", render);

loadClients();

</script>

</body>

</html>
